services:

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_URL=http://github-webhook:8080
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:?}
    networks:
      - cloudflared

  github-webhook:
    image: ghcr.io/kalex3/github-webhook-signal:latest
    restart: unless-stopped
    # Several endpoints: copy routes.example.json to routes.json, uncomment
    # the volume and ROUTES_FILE, and pass each secretEnv in environment.
    # The file must be readable by uid 1000. SIGNAL_RECIPIENT may be a comma-separated list.
    # volumes:
    #   - ./routes.json:/routes.json:ro
    environment:
      - PORT=8080
      - WEBHOOK_PATH=/webhook
      - SIGNAL_API=http://signal-cli:8080
      - SIGNAL_RECIPIENT=${SIGNAL_RECIPIENT:?}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:?}
      # - ROUTES_FILE=/routes.json
    networks:
      - cloudflared
      - signal-cli

  signal-cli:
    image: ghcr.io/asamk/signal-cli:latest-native
    restart: unless-stopped
    command: -a ${SIGNAL_ACCOUNT:?} daemon --http=0.0.0.0:8080
    volumes:
      - ./signal-cli:/var/lib/signal-cli
    networks:
      - signal-cli

networks:
  cloudflared:
  signal-cli:
